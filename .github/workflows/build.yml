
name: Build NovaLauncher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
         pip install psutil requests pyinstaller easy-mc-launcher
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name NovaLauncher .github/workflows/ultrafps.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-Windows
          path: dist/NovaLauncher.exe
