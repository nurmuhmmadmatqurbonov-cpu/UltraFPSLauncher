# build
name: Build UltraFPSLauncher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install psutil requests pyinstaller
      - name: Build EXE
       run: pyinstaller --onefile --windowed --name UltraFPSLauncher .github/workflows/ultrafps.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraFPSLauncher
          path: dist/UltraFPSLauncher.exe
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UltraFPSLauncher.exe
